name: snapshot

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/product/**'
      - '.product/**'
      - '.github/workflows/snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the product snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate the snapshot
        run: pnpm exec prodshape graph --format html

      - name: Name the snapshot after the product
        run: cp .product/generated/snapshot.html pintatonica-product-snapshot.html

      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: pintatonica-product-snapshot.html
          archive: false
          if-no-files-found: error

      - name: Link the snapshot from the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Product snapshot"
            echo
            echo "[pintatonica-product-snapshot.html](${ARTIFACT_URL}) for \`${GITHUB_SHA}\`. Download it and open it in a browser; it needs no server."
          } >> "$GITHUB_STEP_SUMMARY"
